<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Exercício 1 - Urna Hanna-Barbera</title>
  <style>
    body { font-family: sans-serif; background: #f0f2f5; padding: 20px; display: flex; justify-content: center; }
    .container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 500px; width: 100%; }
    .form-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px; }
    select, button { padding: 10px; font-size: 14px; border-radius: 4px; border: 1px solid #ccc; }
    button { background: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:hover { background: #218838; }
    .card-preview { border: 1px solid #eee; padding: 15px; border-radius: 6px; text-align: center; margin: 15px 0; background: #fafafa; }
    .card-preview img { width: 120px; height: 120px; object-fit: cover; border-radius: 50%; margin-bottom: 10px; }
    .status { font-weight: bold; padding: 8px; border-radius: 4px; margin-top: 10px; }
    .elegivel { background: #d4edda; color: #155724; }
    .inelegivel { background: #f8d7da; color: #721c24; }
    .json-output { background: #272822; color: #f8f8f2; padding: 10px; border-radius: 4px; font-family: monospace; font-size: 12px; white-space: pre-wrap; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Eleições Hanna-Barbera</h2>

    <!-- Seletor de Personagem -->
    <div class="form-group">
      <label for="selectPersonagem">Selecione o Candidato:</label>
      <select id="selectPersonagem" onchange="selecionarPersonagem()">
        <option value="">-- Escolha um personagem --</option>
      </select>
    </div>

    <!-- Painel de Detalhes do Personagem -->
    <div id="painelDetalhes" class="card-preview" style="display: none;">
      <img id="fotoCandidato" src="" alt="Foto do Candidato">
      <h3 id="nomeCandidato">---</h3>
      <p>Idade: <strong id="idadeCandidato">--</strong> anos</p>
    </div>

    <!-- Seletor de Cargo Eletivo -->
    <div class="form-group">
      <label for="selectCargo">Cargo Pretendido:</label>
      <select id="selectCargo" onchange="validarElegibilidade()">
        <option value="">-- Escolha o cargo --</option>
        <option value="Presidente">Presidente</option>
        <option value="Senador(a)">Senador(a)</option>
        <option value="Deputado(a) Federal">Deputado(a) Federal</option>
        <option value="Deputado(a) Estadual">Deputado(a) Estadual</option>
      </select>
    </div>

    <!-- Feedback de Elegibilidade -->
    <div id="mensagemStatus" class="status" style="display: none;"></div>

    <br>
    <button id="btnVotar" onclick="registrarVoto()" disabled>Confirmar Voto</button>

    <h3>Registro do Voto (JSON Emitido):</h3>
    <div id="jsonResult" class="json-output">Nenhum voto registrado.</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
