<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #222; color: white; }
    .lampada { width: 120px; height: 120px; border-radius: 50%; background-color: #555; margin-bottom: 20px; transition: background-color 0.3s, box-shadow 0.3s; }
    .lampada.ligada { background-color: #ffeb3b; box-shadow: 0 0 40px #ffeb3b; }
    button { padding: 10px 24px; font-size: 1rem; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>
  <div id="lampada" class="lampada"></div>
  <button id="btn-toggle">Ligar</button>

  <script>
  // 1. Selecione a div da lâmpada e o botão.
const lampada = document.querySelector('#lampada');
const botao = document.querySelector('#btn-toggle');

// 2. Crie um evento de clique no botão
botao.addEventListener('click', () => {
  
  // O toggle adiciona a classe se ela não existir, e remove se ela já existir.
  lampada.classList.toggle('ligada');
  
  // 3. Atualize o texto do botão verificando se a classe está presente
  if (lampada.classList.contains('ligada')) {
    botao.textContent = 'Desligar';
  } else {
    botao.textContent = 'Ligar';
  }
  
});
  </script>
</body>
</html>
