<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacientes - Sistema de Psicologia (JSON)</title>
    <link rel="stylesheet" href="5.3.css">
</head>
<body>

    <div class="container">
        <!-- Esquerda: Listbox com os pacientes -->
        <div class="painel-esquerdo">
            <select id="selectPacientes" size="5"></select>
        </div>

        <!-- Meio: Botões -->
        <div class="painel-meio">
            <button id="btnDetalhes">Detalhes</button>
            <button id="btnAbrirModal">Novo Paciente</button>
            <button id="btnBaixarJson">Exportar JSON</button>
            <button id="btnCarregarJson">Importar JSON</button>
            <input type="file" id="fileInputJson" accept=".json" style="display: none;">
        </div>

        <!-- Direita: Quatro divs/quadros de informações -->
        <div class="painel-direito">
            <div class="card-info">
                <strong>Nome</strong>
                <div id="divNome">-</div>
            </div>
            <div class="card-info">
                <strong>Idade</strong>
                <div id="divIdade">-</div>
            </div>
            <div class="card-info">
                <strong>Última Sessão</strong>
                <div id="divUltimaSessao">-</div>
            </div>
            <div class="card-info">
                <strong>Status</strong>
                <div id="divStatus">-</div>
            </div>
        </div>
    </div>

    <!-- Modal de Formulário -->
    <div class="modal-overlay" id="modalForm">
        <div class="modal-content">
            <h3>Cadastrar Novo Paciente</h3>
            <div class="form-group">
                <label for="inputNome">Nome do Paciente:</label>
                <input type="text" id="inputNome" placeholder="Ex: Paciente 6">
            </div>
            <div class="form-group">
                <label for="inputIdade">Idade:</label>
                <input type="text" id="inputIdade" placeholder="Ex: 30 anos">
            </div>
            <div class="form-group">
                <label for="inputUltimaSessao">Data da última sessão:</label>
                <input type="text" id="inputUltimaSessao" placeholder="Ex: 17/09/2026">
            </div>
            <div class="form-group">
                <label for="inputStatus">Status:</label>
                <input type="text" id="inputStatus" placeholder="Ex: Em acompanhamento">
            </div>
            
            <div class="modal-acoes">
                <button type="button" class="btn-cancelar" id="btnCancelar">Cancelar</button>
                <button type="button" class="btn-salvar" id="btnSalvar">Salvar</button>
            </div>
        </div>
    </div>
    
    <script src="5.3.js"></script>
</body>
</html>
