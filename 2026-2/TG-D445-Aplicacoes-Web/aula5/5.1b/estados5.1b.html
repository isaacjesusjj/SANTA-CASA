<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="5.1b.css">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacientes - Sistema de Psicologia</title>
</head>

<body>

    <div class="container">

        <!-- Esquerda: Lista de pacientes -->
        <div class="painel-esquerdo">
            <select id="selectPacientes" size="5">
                <option value="0" selected>Paciente 1</option>
                <option value="1">Paciente 2</option>
                <option value="2">Paciente 3</option>
                <option value="3">Paciente 4</option>
                <option value="4">Paciente 5</option>
            </select>
        </div>

        <!-- Meio: Botão -->
        <div class="painel-meio">
            <button id="btnDetalhes">Detalhes</button>
        </div>

        <!-- Direita: Informações do paciente -->
        <div class="painel-direito">

            <div class="card-info">
                <strong>Nome</strong>
                <div id="divNome">-</div>
            </div>

            <div class="card-info">
                <strong>Idade</strong>
                <div id="divIdade">-</div>
            </div>

            <div class="card-info">
                <strong>Data da última sessão</strong>
                <div id="divUltimaSessao">-</div>
            </div>

            <div class="card-info">
                <strong>Status</strong>
                <div id="divStatus">-</div>
            </div>

        </div>

    </div>

    <script src="1b.js"></script>

</body>

</html>
